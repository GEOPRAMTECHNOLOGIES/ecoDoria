{% extends "base.html" %}{% block content %}<div class="max-w-md mx-auto bg-white rounded-2xl shadow p-6"><h1 class="text-2xl font-bold">Sign in as an Eco Patroller</h1><form id="otp" class="space-y-3 mt-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="phone" required placeholder="+2547XXXXXXXX" class="border p-3 rounded w-full"><button class="bg-green-700 text-white rounded p-3 w-full">Send phone OTP</button></form><form id="verify" action="/auth/verify-otp" method="post" class="space-y-3 mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="phone" required placeholder="Phone used above" class="border p-3 rounded w-full"><input name="code" required placeholder="6-digit code" class="border p-3 rounded w-full"><button class="bg-black text-white rounded p-3 w-full">Verify & sign in</button></form><script>document.getElementById('otp').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target);let r=await fetch('/auth/request-otp',{method:'POST',body:d});alert((await r.json()).message||'OTP request failed')};</script><p class="mt-4 text-sm"><a href="/admin/login" class="underline">Administrator sign in</a></p></div>{% endblock %}
