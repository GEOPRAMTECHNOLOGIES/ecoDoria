{% extends "base.html" %}{% block content %}<div class="max-w-2xl mx-auto"><h1 class="text-3xl font-bold">Spot-verified capture</h1><p class="text-slate-600 my-2">Allow camera and precise location. No file upload is used.</p><video id="video" autoplay playsinline class="w-full bg-black rounded-xl"></video><canvas id="canvas" class="hidden"></canvas><button id="start" class="bg-black text-white rounded p-3 mt-3">Start camera</button><button id="capture" class="bg-green-700 text-white rounded p-3 mt-3">Capture with GPS</button><form method="post" class="bg-white rounded-xl shadow p-5 mt-4 space-y-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="photo" id="photo"><input type="hidden" name="lat" id="lat"><input type="hidden" name="lng" id="lng"><input type="hidden" name="accuracy" id="accuracy"><input type="hidden" name="captured_at" id="captured"><label class="block font-semibold">Issue category</label><select name="category" class="border p-3 rounded w-full">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><textarea name="notes" placeholder="Describe what you observed" class="border p-3 rounded w-full"></textarea><input name="ward" placeholder="Ward (optional)" class="border p-3 rounded w-full"><div id="construction" class="hidden space-y-2"><label>Approval board visible?</label><select name="board" class="border p-2 w-full"><option value="yes">Yes</option><option value="no">No</option></select><input name="permit" placeholder="Permit number" class="border p-2 w-full"><input name="floors" placeholder="Floors seen" class="border p-2 w-full"><label>Cracks?</label><select name="cracks" class="border p-2 w-full"><option value="no">No</option><option value="yes">Yes</option></select></div><label><input type="checkbox" name="anonymous" value="yes"> Display anonymously</label><div id="pin" class="h-64 rounded"></div><p class="text-xs text-slate-500">Confirm the pin on the map before submitting.</p><button class="bg-red-600 text-white p-4 rounded-xl w-full font-bold">Submit alleged report</button></form></div><script>let stream,coords,map,marker;document.getElementById('start').onclick=async()=>{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});document.getElementById('video').srcObject=stream};document.querySelector('[name=category]').onchange=e=>document.getElementById('construction').classList.toggle('hidden',!e.target.value.includes('construction')&&!e.target.value.includes('structure'));document.getElementById('capture').onclick=()=>navigator.geolocation.getCurrentPosition(pos=>{coords=pos.coords;let v=document.getElementById('video'),c=document.getElementById('canvas');c.width=v.videoWidth;c.height=v.videoHeight;let x=c.getContext('2d');x.drawImage(v,0,0);x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,c.height-55,c.width,55);x.fillStyle='white';x.font='20px sans-serif';x.fillText(`EcoDoria · ${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)} · ±${Math.round(coords.accuracy)}m · ${new Date().toISOString()}`,10,c.height-20);document.getElementById('photo').value=c.toDataURL('image/jpeg',.65);lat.value=coords.latitude;lng.value=coords.longitude;accuracy.value=coords.accuracy;captured.value=new Date().toISOString();if(!map){map=L.map('pin').setView([coords.latitude,coords.longitude],17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);marker=L.marker([coords.latitude,coords.longitude],{draggable:true}).addTo(map);marker.on('dragend',()=>{let p=marker.getLatLng();lat.value=p.lat;lng.value=p.lng})}else{map.setView([coords.latitude,coords.longitude],17);marker.setLatLng([coords.latitude,coords.longitude])}alert('Photo captured. Confirm or move the map pin.');},e=>alert(e.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000});</script>{% endblock %}
